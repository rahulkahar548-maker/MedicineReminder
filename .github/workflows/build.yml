name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: gradle wrapper

      - run: chmod +x ./gradlew

      - run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
